[workspace]
channels = ["conda-forge"]
name = "globgm_cmip6"
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
python = ">=3.12,<3.14"
xarray = ">=2025.10"
fsspec = "*"
zarr = "*"
dask = "*"
requests = "*"
aiohttp = "*"
jupyter = "*"
itables = "*"
h5netcdf = "*"
netcdf4 = "*"
pydap = "*"
pandas = "*"
quarto = ">=1.9,<2"
rclone = ">=1.75.0,<2"

[tasks]
render = "quarto render"
preview = "quarto preview"
publish = "quarto publish gh-pages --no-prompt --no-browser"
